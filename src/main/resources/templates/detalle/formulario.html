<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Detalle de Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0" th:text="${titulo}"></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${detalle.codigoDetalleVenta != null} ? @{/detallesVentas/actualizar/{code}(code=${detalle.codigoDetalleVenta})} : @{/detallesVentas/guardar}"
                              th:object="${detalle}" method="post">

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Detalle de Venta</legend>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Venta <span class="text-danger">*</span></label>
                                    <select name="ventaId" class="form-select" required>
                                        <option value="">-- Seleccione una venta --</option>
                                        <option th:each="v : ${ventas}"
                                                th:value="${v.codigoVenta}"
                                                th:selected="${detalle.venta != null && detalle.venta.codigoVenta == v.codigoVenta}"
                                                th:text="'Venta #' + ${v.codigoVenta} + ' - ' + ${v.cliente.nombreCliente}">
                                        </option>
                                    </select>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label fw-bold">Producto <span class="text-danger">*</span></label>
                                    <select name="productoId" class="form-select" required>
                                        <option value="">-- Seleccione un producto --</option>
                                        <option th:each="p : ${productos}"
                                                th:value="${p.codigoProducto}"
                                                th:selected="${detalle.producto != null && detalle.producto.codigoProducto == p.codigoProducto}"
                                                th:text="${p.nombreProducto} + ' - Q ' + ${p.precio}">
                                        </option>
                                    </select>
                                </div>

                                <div class="row">
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Cantidad <span class="text-danger">*</span></label>
                                        <input type="number" step="1" min="1" th:field="*{cantidad}" class="form-control"
                                               th:classappend="${#fields.hasErrors('cantidad')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('cantidad')}" class="invalid-feedback" th:errors="*{cantidad}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Precio Unitario <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text">Q</span>
                                            <input type="number" step="0.01" min="0.01" th:field="*{precioUnitario}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('precioUnitario')} ? 'is-invalid' : ''">
                                        </div>
                                        <div th:if="${#fields.hasErrors('precioUnitario')}" class="invalid-feedback" th:errors="*{precioUnitario}"></div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Subtotal</label>
                                        <div class="input-group">
                                            <span class="input-group-text">Q</span>
                                            <input type="number" step="0.01" th:field="*{subtotal}" class="form-control" readonly>
                                        </div>
                                        <div class="form-text">Se calcula automáticamente (Cantidad × Precio Unitario)</div>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/detallesVentas}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    const cantidadInput = document.querySelector('input[name="cantidad"]');
    const precioInput = document.querySelector('input[name="precioUnitario"]');
    const subtotalInput = document.querySelector('input[name="subtotal"]');

    function calcularSubtotal() {
        const cantidad = parseFloat(cantidadInput?.value) || 0;
        const precio = parseFloat(precioInput?.value) || 0;
        const subtotal = cantidad * precio;
        if (subtotalInput) subtotalInput.value = subtotal.toFixed(2);
    }

    if (cantidadInput) cantidadInput.addEventListener('input', calcularSubtotal);
    if (precioInput) precioInput.addEventListener('input', calcularSubtotal);
</script>
</body>
</html>
