<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Nuevo Detalle de Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-cart-plus me-2"></i>Nuevo Detalle de Venta
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/detallesVentas/guardar}" th:object="${detalle}" method="post">

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="bi bi-receipt me-1"></i>Venta (Código)</label>
                                    <select name="ventaId" class="form-select border-primary-subtle" required>
                                        <option value="" selected disabled>Seleccione una venta...</option>
                                        <option th:each="v : ${ventas}"
                                                th:value="${v.codigoVenta}"
                                                th:text="${'Venta #' + v.codigoVenta + ' - ' + v.fechaVenta}"></option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold"><i class="bi bi-box-seam me-1"></i>Producto</label>
                                    <select name="productoId" class="form-select border-primary-subtle" required>
                                        <option value="" selected disabled>Seleccione un producto...</option>
                                        <option th:each="p : ${productos}"
                                                th:value="${p.codigoProducto}"
                                                th:text="${p.nombreProducto}"></option>
                                    </select>
                                </div>
                            </div>

                            <hr class="text-muted opacity-25">

                            <div class="row g-3 align-items-end">
                                <div class="col-md-3">
                                    <label class="form-label fw-bold">Cantidad</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-hash"></i></span>
                                        <input type="number" th:field="*{cantidad}" class="form-control text-center"
                                               placeholder="0" required min="1">
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label fw-bold">Precio Unitario</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">Q</span>
                                        <input type="number" step="0.01" th:field="*{precioUnitario}"
                                               class="form-control" placeholder="0.00" required>
                                    </div>
                                </div>
                                <div class="col-md-5">
                                    <label class="form-label fw-bold text-primary">Subtotal</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-primary text-white">Q</span>
                                        <input type="number" step="0.01" th:field="*{subtotal}"
                                               class="form-control form-control-lg fw-bold border-primary"
                                               placeholder="0.00" required>
                                    </div>
                                    <div class="form-text text-end">Calculado automáticamente</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mt-5">
                                <a th:href="@{/detallesVentas}" class="btn btn-link text-decoration-none text-muted">
                                    <i class="bi bi-arrow-left"></i> Regresar al listado
                                </a>
                                <div>
                                    <a th:href="@{/detallesVentas}" class="btn btn-outline-secondary px-4 me-2">Cancelar</a>
                                    <button type="submit" class="btn btn-success px-5 shadow-sm">
                                        <i class="bi bi-check-lg me-1"></i> Guardar Detalle
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
