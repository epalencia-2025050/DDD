<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title>Nuevo Detalle de Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3>Nuevo Detalle de Venta</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/detallesVentas/guardar}" th:object="${detalle}" method="post">
                <div class="mb-3">
                    <label>Cantidad</label>
                    <input type="number" th:field="*{cantidad}" class="form-control" required min="1">
                </div>
                <div class="mb-3">
                    <label>Precio Unitario</label>
                    <input type="number" step="0.01" th:field="*{precioUnitario}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Subtotal</label>
                    <input type="number" step="0.01" th:field="*{subtotal}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Venta (código)</label>
                    <select name="ventaId" class="form-select" required>
                        <option value="">Seleccione una venta</option>
                        <option th:each="v : ${ventas}" th:value="${v.codigoVenta}" th:text="${'Venta #' + v.codigoVenta + ' - ' + v.fechaVenta}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Producto</label>
                    <select name="productoId" class="form-select" required>
                        <option value="">Seleccione un producto</option>
                        <option th:each="p : ${productos}" th:value="${p.codigoProducto}" th:text="${p.nombreProducto}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/detallesVentas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
