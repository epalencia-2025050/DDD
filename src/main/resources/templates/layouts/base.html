<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KS SOLUTION'S | ERP</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <link rel="stylesheet" th:href="@{/css/global.css}">

    <style>
        :root {
            --sidebar-width: 260px;
            --primary-color: #1B365D;
            --accent-color: #FF8C00;
            --bg-light: #f0f2f5;
        }
        body { background-color: var(--bg-light); font-family: 'Inter', sans-serif; overflow-x: hidden; }

        .sidebar {
            width: var(--sidebar-width);
            height: 100vh;
            position: fixed;
            background: var(--primary-color);
            color: white;
            transition: all 0.3s;
            z-index: 1000;
            border-right: 4px solid var(--accent-color);
        }

        .sidebar-header {
            padding: 30px 20px;
            text-align: center;
            background: rgba(0,0,0,0.2);
            margin: 15px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .sidebar-header img {
            width: 100px;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255, 140, 0, 0.4));
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .sidebar-header:hover img {
            transform: scale(1.1) rotate(2deg);
            filter: drop-shadow(0 0 15px rgba(255, 140, 0, 0.7));
        }

        .nav-link {
            color: rgba(255,255,255,0.7);
            padding: 12px 25px;
            display: flex;
            align-items: center;
            transition: 0.3s;
            border-radius: 0 50px 50px 0;
            margin: 5px 10px 5px 0;
        }
        .nav-link i { font-size: 1.2rem; margin-right: 15px; }
        .nav-link:hover, .nav-link.active {
            background: rgba(255,255,255,0.1);
            color: var(--accent-color);
        }

        .main-content {
            margin-left: var(--sidebar-width);
            padding: 30px;
            min-height: 100vh;
        }

        .user-pill {
            background: white;
            padding: 8px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            border: 1px solid #eee;
        }
    </style>
</head>
<body>
<div class="sidebar shadow">
    <div class="sidebar-header shadow-sm">
        <img th:src="@{/images/logo.png}" alt="KS Logo" class="mb-2">
        <h6 class="mt-2 fw-bold text-white">KS SOLUTION'S</h6>
        <div class="badge bg-warning text-dark small" style="font-size: 0.6rem;">ERP SYSTEM</div>
    </div>

    <nav class="mt-4">
        <a href="/menu" class="nav-link"><i class="bi bi-speedometer2"></i> Dashboard</a>
        <a href="/usuarios" class="nav-link"><i class="bi bi-shield-lock"></i> Usuarios</a>
        <a href="/clientes" class="nav-link"><i class="bi bi-person-lines-fill"></i> Clientes</a>
        <a href="/productos" class="nav-link"><i class="bi bi-box-seam"></i> Productos</a>
        <a href="/ventas" class="nav-link"><i class="bi bi-cart4"></i> Nueva Venta</a>

        <a href="/facturas" class="nav-link"><i class="bi bi-receipt-cutoff"></i> Facturación</a>

        <div class="position-absolute bottom-0 w-100 p-3">
            <a th:href="@{/logout}" class="btn btn-outline-light w-100 rounded-pill border-0">
                <i class="bi bi-box-arrow-left"></i> Cerrar Sesión
            </a>
        </div>
    </nav>
</div>

<div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold text-dark" th:text="${titulo}">Título</h4>
        <div class="user-pill d-flex align-items-center">
            <span class="px-3 fw-bold text-primary small"
                  th:text="${session.usuarioLogueado?.username ?: 'Invitado'}">User</span>
            <i class="bi bi-person-circle fs-4 text-primary"></i>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-dismissible fade show shadow-sm border-0 bg-white border-start border-5"
         th:classappend="'border-' + (${tipoMensaje} ?: 'primary')">
        <i class="bi bi-info-circle-fill me-2"></i>
        <span th:text="${mensaje}">Mensaje</span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div th:replace="~{::content}"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
