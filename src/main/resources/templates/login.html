<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - KS SOLUTION'S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --azul-marino: #1B365D;
            --azul-real: #2A5DA0;
            --naranja: #FF8C00;
        }

        body {
            background: linear-gradient(135deg, var(--azul-marino) 0%, var(--azul-real) 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            margin: 0;
        }

        .login-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            background-color: rgba(255, 255, 255, 0.98);
        }

        .card-header {
            background-color: var(--azul-marino) !important;
            border-bottom: 4px solid var(--naranja);
            padding: 2.5rem 1rem;
        }

        .brand-logo {
            font-size: 1.8rem;
            font-weight: 800;
            letter-spacing: -1px;
            color: white;
            margin-bottom: 0;
        }

        .brand-icon-img {
            height: 45px;
            width: auto;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            object-fit: contain;
        }

        .form-control {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            border: 1px solid #dee2e6;
            border-left: none;
        }

        .form-control:focus {
            border-color: var(--azul-real);
            box-shadow: none;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-right: none;
            color: var(--azul-real);
            border-radius: 10px 0 0 10px;
        }

        .btn-primary {
            background-color: var(--azul-real);
            border: none;
            border-radius: 10px;
            padding: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background-color: var(--azul-marino);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .login-footer {
            font-size: 0.9rem;
            color: #6c757d;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">

            <div class="card login-card">
                <div class="card-header text-center">
                    <h1 class="brand-logo d-flex align-items-center justify-content-center">
                        <img th:src="@{/images/logo.png}" alt="Logo KS" class="brand-icon-img me-2">
                        KS SOLUTION'S
                    </h1>
                    <p class="text-white-50 mb-0 mt-2 small text-uppercase fw-bold">Gestión de Ventas & ERP</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <h4 class="text-center mb-4 fw-bold text-dark">Bienvenido</h4>

                    <!-- Mensajes de Spring Security -->
                    <div th:if="${param.error}" class="alert alert-danger mt-2 py-2 small border-0 shadow-sm text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        Correo electrónico o contraseña incorrectos
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success mt-2 py-2 small border-0 shadow-sm text-center" role="alert">
                        <i class="bi bi-check-circle-fill me-2"></i>
                        Has cerrado sesión correctamente
                    </div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary text-uppercase">Correo electrónico</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <!-- CAMBIO IMPORTANTE: name="username" -->
                                <input type="email" name="username" class="form-control"
                                       placeholder="usuario@kssolutions.com" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-secondary text-uppercase">Contraseña</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                <input type="password" name="password" class="form-control"
                                       placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 shadow">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Acceder al Panel
                        </button>
                    </form>

                    <div class="mt-4 text-center login-footer">
                        <span>¿Nuevo en el sistema?</span><br>
                        <a th:href="@{/registro}" class="text-decoration-none fw-bold" style="color: var(--naranja);">
                            Solicitar acceso / Registro
                        </a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4 text-white-50 small">
                &copy; 2026 KS SOLUTION'S - Potenciando tu productividad
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
