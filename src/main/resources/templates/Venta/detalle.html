<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Detalle de Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-10">

                <div class="card shadow-lg border-0">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center py-3">
                        <h4 class="mb-0">
                            <i class="bi bi-receipt me-2 text-warning"></i>
                            <span th:text="${titulo}">Resumen de Venta</span>
                        </h4>
                        <span class="badge rounded-pill bg-light text-dark px-3 fw-bold"
                              th:text="'ID: #' + ${venta.codigoVenta}"></span>
                    </div>

                    <div class="card-body p-4">
                        <div class="row mb-4">
                            <div class="col-md-6">
                                <h5 class="text-primary border-bottom pb-2 mb-3">Datos del Cliente</h5>
                                <p class="mb-1"><i class="bi bi-person-fill text-muted me-2"></i>
                                    <strong th:text="${venta.cliente.nombreCliente + ' ' + venta.cliente.apellidoCliente}"></strong></p>
                                <p class="mb-1 text-muted"><i class="bi bi-geo-alt-fill me-2"></i>
                                    <span th:text="${venta.cliente.direccion}"></span></p>
                                <p class="mb-0 text-muted"><i class="bi bi-card-text me-2"></i>
                                    <span th:text="'DPI: ' + ${venta.cliente.DPICliente}"></span></p>
                            </div>
                            <div class="col-md-6 text-md-end mt-3 mt-md-0">
                                <h5 class="text-primary border-bottom pb-2 mb-3 text-md-end">Información de Transacción</h5>
                                <p class="mb-1"><strong>Fecha:</strong> <span th:text="${venta.fechaVenta}"></span></p>
                                <p class="mb-1"><strong>Vendedor:</strong> <span th:text="${venta.usuario.username}"></span></p>
                                <p class="mb-0"><strong>Estado:</strong>
                                    <span th:if="${venta.estado == 1}" class="badge bg-success-subtle text-success border border-success px-3">Activa</span>
                                    <span th:if="${venta.estado == 0}" class="badge bg-secondary-subtle text-secondary border px-3">Inactiva</span>
                                </p>
                            </div>
                        </div>

                        <div class="table-responsive bg-light rounded-3 p-3">
                            <h5 class="mb-3"><i class="bi bi-bag-check me-2"></i>Artículos Consignados</h5>
                            <table class="table table-hover align-middle">
                                <thead class="table-primary border-0">
                                <tr>
                                    <th class="ps-3">Producto</th>
                                    <th class="text-center">Cantidad</th>
                                    <th class="text-end">Precio Unit.</th>
                                    <th class="text-end pe-3">Subtotal</th>
                                </tr>
                                </thead>
                                <tbody>
                                <tr th:each="d : ${venta.detalles}">
                                    <td class="ps-3">
                                        <span class="fw-semibold text-dark" th:text="${d.producto.nombreProducto}"></span>
                                    </td>
                                    <td class="text-center" th:text="${d.cantidad}"></td>
                                    <td class="text-end">Q <span th:text="${#numbers.formatDecimal(d.precioUnitario, 1, 2)}"></span></td>
                                    <td class="text-end pe-3 fw-bold">Q <span th:text="${#numbers.formatDecimal(d.subtotal, 1, 2)}"></span></td>
                                </tr>
                                <tr th:if="${#lists.isEmpty(venta.detalles)}">
                                    <td colspan="4" class="text-center py-4 text-muted">No hay detalles registrados en esta venta</td>
                                </tr>
                                </tbody>
                                <tfoot class="table-group-divider">
                                <tr>
                                    <td colspan="3" class="text-end fs-5 fw-bold text-dark pt-3">TOTAL GENERAL:</td>
                                    <td class="text-end pe-3 fs-4 fw-bold text-primary pt-3">
                                        Q <span th:text="${#numbers.formatDecimal(venta.total, 1, 2)}"></span>
                                    </td>
                                </tr>
                                </tfoot>
                            </table>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top">
                            <a th:href="@{/ventas}" class="btn btn-outline-secondary px-4">
                                <i class="bi bi-arrow-left me-2"></i>Volver al Listado
                            </a>
                            <button class="btn btn-primary px-4 shadow-sm" onclick="window.print()">
                                <i class="bi bi-printer me-2"></i>Imprimir Factura
                                </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
</body>
</html>
