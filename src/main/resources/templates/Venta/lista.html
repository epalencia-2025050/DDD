<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layouts/base :: html}">
<div th:fragment="content">
    <div class="d-flex justify-content-between mb-4">
        <div class="btn-group shadow-sm">
            <a th:href="@{/ventas/nuevo}" class="btn btn-primary btn-action">+ Nueva Transacción</a>
        </div>
        <div class="btn-group shadow-sm">
            <a th:href="@{/ventas}" class="btn btn-white btn-sm border">Todas</a>
            <a th:href="@{/ventas/activos/1}" class="btn btn-white btn-sm border">Activas</a>
            <a th:href="@{/ventas/activos/0}" class="btn btn-white btn-sm border">Anuladas</a>
        </div>
    </div>

    <div class="glass-card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="bg-primary text-white">
                <tr>
                    <th class="py-3 ps-4">ID Venta</th>
                    <th>Fecha Emisión</th>
                    <th>Cliente</th>
                    <th>Responsable</th>
                    <th>Total</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody class="bg-white">
                <tr th:each="v : ${ventas}">
                    <td class="ps-4 fw-bold text-primary" th:text="${'#V-' + v.codigoVenta}"></td>
                    <td th:text="${v.fechaVenta}"></td>
                    <td>
                        <div class="d-flex align-items-center">
                            <div class="bg-accent rounded-circle p-2 me-2" style="background:#fff3e0"><i class="bi bi-person text-warning"></i></div>
                            <span th:text="${v.cliente != null ? v.cliente.nombreCliente : 'N/A'}"></span>
                        </div>
                    </td>
                    <td th:text="${v.usuario != null ? v.usuario.username : 'N/A'}"></td>
                    <td class="fw-bold text-success" th:text="'Q ' + ${v.total}"></td>
                    <td>
                        <a th:href="@{/ventas/ver/{code}(code=${v.codigoVenta})}" class="btn btn-primary btn-sm rounded-pill px-3 shadow-sm">
                            <i class="bi bi-eye"></i> Ver Detalle
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</html>
