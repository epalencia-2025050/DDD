<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title>Lista de Ventas</title>
</head>
<body>
<div th:fragment="content">
    <h1 class="mb-4" th:text="${titulo}">Ventas</h1>
    <div class="mb-3">
        <a th:href="@{/ventas/nuevo}" class="btn btn-primary">+ Nueva Venta</a>
        <div class="btn-group">
            <a th:href="@{/ventas/activos/1}" class="btn btn-outline-success">Activas</a>
            <a th:href="@{/ventas/activos/0}" class="btn btn-outline-danger">Anuladas</a>
            <a th:href="@{/ventas}" class="btn btn-outline-secondary">Todas</a>
        </div>
    </div>
    <table class="table table-striped">
        <thead>
        <tr>
            <th>Código</th>
            <th>Fecha</th>
            <th>Total</th>
            <th>Cliente</th>
            <th>Usuario</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${ventas}">
            <td th:text="${v.codigoVenta}"></td>
            <td th:text="${v.fechaVenta}"></td>
            <td th:text="${v.total}"></td>
            <td th:text="${v.cliente != null ? v.cliente.nombreCliente + ' ' + v.cliente.apellidoCliente : 'N/A'}"></td>
            <td th:text="${v.usuario != null ? v.usuario.username : 'N/A'}"></td>
            <td>
                <span th:if="${v.estado == 1}" class="badge bg-success">Activa</span>
                <span th:if="${v.estado == 0}" class="badge bg-secondary">Anulada</span>
            </td>
            <td>
                <a th:href="@{/ventas/ver/{code}(code=${v.codigoVenta})}" class="btn btn-sm btn-info">Ver</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(ventas)}">
            <td colspan="7" class="text-center">No hay ventas registradas</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
