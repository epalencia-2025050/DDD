<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0" th:text="${titulo}"></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${venta.codigoVenta != null} ? @{/ventas/actualizar/{code}(code=${venta.codigoVenta})} : @{/ventas/guardar}"
                              th:object="${venta}" method="post">

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Datos de la Venta</legend>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Fecha de Venta <span class="text-danger">*</span></label>
                                    <input type="date" th:field="*{fechaVenta}" class="form-control"
                                           th:classappend="${#fields.hasErrors('fechaVenta')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('fechaVenta')}" class="invalid-feedback" th:errors="*{fechaVenta}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Cliente <span class="text-danger">*</span></label>
                                    <select th:field="*{cliente}" class="form-select"
                                            th:classappend="${#fields.hasErrors('cliente')} ? 'is-invalid' : ''">
                                        <option value="">-- Seleccione un cliente --</option>
                                        <option th:each="cli : ${clientes}" th:value="${cli.DPICliente}" th:text="${cli.nombreCliente + ' ' + cli.apellidoCliente}"></option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('cliente')}" class="invalid-feedback" th:errors="*{cliente}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Usuario Responsable <span class="text-danger">*</span></label>
                                    <select th:field="*{usuario}" class="form-select"
                                            th:classappend="${#fields.hasErrors('usuario')} ? 'is-invalid' : ''">
                                        <option value="">-- Seleccione un usuario --</option>
                                        <option th:each="user : ${usuarios}" th:value="${user.codigoUsuario}" th:text="${user.username}"></option>
                                    </select>
                                    <div th:if="${#fields.hasErrors('usuario')}" class="invalid-feedback" th:errors="*{usuario}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Total <span class="text-danger">*</span></label>
                                    <div class="input-group">
                                        <span class="input-group-text">Q</span>
                                        <input type="number" step="0.01" th:field="*{total}" class="form-control"
                                               th:classappend="${#fields.hasErrors('total')} ? 'is-invalid' : ''">
                                    </div>
                                    <div th:if="${#fields.hasErrors('total')}" class="invalid-feedback" th:errors="*{total}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Estado</label>
                                    <select th:field="*{estado}" class="form-select">
                                        <option th:value="1">Activa</option>
                                        <option th:value="0">Anulada</option>
                                    </select>
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/ventas}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
