<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Nueva Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-header">
            <h3 th:text="${titulo}"></h3>
        </div>
        <div class="card-body">
            <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">
                <div class="mb-3">
                    <label>Fecha</label>
                    <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Total</label>
                    <input type="number" step="0.01" th:field="*{total}" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>Cliente (DPI)</label>
                    <select name="clienteDpi" class="form-select" required>
                        <option value="">Seleccione cliente</option>
                        <option th:each="c : ${clientes}" th:value="${c.DPICliente}" th:text="${c.nombreCliente + ' ' + c.apellidoCliente}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Usuario (Código)</label>
                    <select name="usuarioCode" class="form-select" required>
                        <option value="">Seleccione usuario</option>
                        <option th:each="u : ${usuarios}" th:value="${u.codigoUsuario}" th:text="${u.username}"></option>
                    </select>
                </div>
                <div class="mb-3">
                    <label>Estado</label>
                    <select th:field="*{estado}" class="form-select">
                        <option th:value="1">Activa</option>
                        <option th:value="0">Anulada</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/ventas}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
