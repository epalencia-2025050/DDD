<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Nueva Venta</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-9">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0 d-flex align-items-center">
                            <i class="bi bi-cart-plus-fill me-2"></i>
                            <span th:text="${titulo}">Registro de Venta</span>
                        </h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="@{/ventas/guardar}" th:object="${venta}" method="post">

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Fecha de Transacción</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-calendar-event"></i></span>
                                        <input type="date" th:field="*{fechaVenta}" class="form-control" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Estado de Venta</label>
                                    <select th:field="*{estado}" class="form-select border-2">
                                        <option th:value="1">🟢 Activa / Procesada</option>
                                        <option th:value="0">🔴 Anulada / Cancelada</option>
                                    </select>
                                </div>
                            </div>

                            <hr class="my-4 opacity-25">

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Cliente (Receptor)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person-badge"></i></span>
                                        <select name="clienteDpi" class="form-select" required>
                                            <option value="" selected disabled>Seleccione un cliente...</option>
                                            <option th:each="c : ${clientes}"
                                                    th:value="${c.DPICliente}"
                                                    th:text="${c.nombreCliente + ' ' + c.apellidoCliente + ' (DPI: ' + c.DPICliente + ')'}"></option>
                                        </select>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label fw-bold text-secondary">Vendedor (Responsable)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light"><i class="bi bi-person-workspace"></i></span>
                                        <select name="usuarioCode" class="form-select" required>
                                            <option value="" selected disabled>Seleccione usuario...</option>
                                            <option th:each="u : ${usuarios}"
                                                    th:value="${u.codigoUsuario}"
                                                    th:text="${u.username}"></option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="row mb-4">
                                <div class="col-md-12">
                                    <label class="form-label fw-bold text-primary">Total de la Venta</label>
                                    <div class="input-group input-group-lg">
                                        <span class="input-group-text bg-primary text-white fw-bold">Q</span>
                                        <input type="number" step="0.01" th:field="*{total}"
                                               class="form-control fw-bold border-primary text-end"
                                               placeholder="0.00" required>
                                    </div>
                                    <div class="form-text text-end">Suma total de los detalles de venta.</div>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-3 mt-4">
                                <a th:href="@{/ventas}" class="btn btn-outline-secondary px-4">
                                    <i class="bi bi-arrow-left me-1"></i> Cancelar
                                </a>
                                <button type="submit" class="btn btn-primary px-5 shadow-sm">
                                    <i class="bi bi-check-circle me-1"></i> Finalizar Venta
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
