<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Usuario</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0" th:text="${titulo}"></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${usuario.codigoUsuario != null} ? @{/usuarios/actualizar/{code}(code=${usuario.codigoUsuario})} : @{/usuarios/guardar}"
                              th:object="${usuario}" method="post">

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Datos de Acceso</legend>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Username <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{username}" class="form-control"
                                           th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('username')}" class="invalid-feedback" th:errors="*{username}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Email <span class="text-danger">*</span></label>
                                    <input type="email" th:field="*{email}" class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('email')}" class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Contraseña <span class="text-danger">*</span></label>
                                    <input type="password" th:field="*{password}" class="form-control"
                                           th:classappend="${#fields.hasErrors('password')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('password')}" class="invalid-feedback" th:errors="*{password}"></div>
                                    <div class="form-text">Mínimo 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.</div>
                                </div>
                            </fieldset>

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Configuración de Cuenta</legend>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Rol</label>
                                        <select th:field="*{rol}" class="form-select">
                                            <option value="USER">Usuario</option>
                                            <option value="ADMIN">Administrador</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Estado</label>
                                        <select th:field="*{estado}" class="form-select">
                                            <option th:value="1">Activo</option>
                                            <option th:value="0">Inactivo</option>
                                        </select>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
