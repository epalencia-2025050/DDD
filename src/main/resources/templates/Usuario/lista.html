<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title>Lista de Usuarios</title>
</head>
<body>
<div th:fragment="content">
    <h1 class="mb-4" th:text="${titulo}">Usuarios</h1>
    <div class="mb-3">
        <a th:href="@{/usuarios/nuevo}" class="btn btn-primary">+ Nuevo Usuario</a>
        <div class="btn-group">
            <a th:href="@{/usuarios/activos/1}" class="btn btn-outline-success">Activos</a>
            <a th:href="@{/usuarios/activos/0}" class="btn btn-outline-danger">Inactivos</a>
            <a th:href="@{/usuarios}" class="btn btn-outline-secondary">Todos</a>
        </div>
    </div>
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Código</th>
            <th>Username</th>
            <th>Email</th>
            <th>Rol</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${usuarios}">
            <td th:text="${u.codigoUsuario}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.rol}"></td>
            <td>
                <span th:if="${u.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${u.estado == 0}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <a th:href="@{/usuarios/editar/{code}(code=${u.codigoUsuario})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/usuarios/eliminar/{code}(code=${u.codigoUsuario})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(usuarios)}">
            <td colspan="6" class="text-center">No hay usuarios registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
