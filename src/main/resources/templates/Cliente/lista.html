<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <h1 class="mb-4" th:text="${titulo}">Clientes</h1>
    <div class="mb-3">
        <a th:href="@{/clientes/nuevo}" class="btn btn-primary">+ Nuevo Cliente</a>
        <div class="btn-group">
            <a th:href="@{/clientes/activos/1}" class="btn btn-outline-success">Activos</a>
            <a th:href="@{/clientes/activos/0}" class="btn btn-outline-danger">Inactivos</a>
            <a th:href="@{/clientes}" class="btn btn-outline-secondary">Todos</a>
        </div>
    </div>
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>DPI</th>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>Dirección</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="c : ${clientes}">
            <td th:text="${c.DPICliente}"></td>
            <td th:text="${c.nombreCliente}"></td>
            <td th:text="${c.apellidoCliente}"></td>
            <td th:text="${c.direccion}"></td>
            <td>
                <span th:if="${c.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${c.estado == 0}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <a th:href="@{/clientes/editar/{dpi}(dpi=${c.DPICliente})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/clientes/eliminar/{dpi}(dpi=${c.DPICliente})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(clientes)}">
            <td colspan="6" class="text-center">No hay clientes registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
