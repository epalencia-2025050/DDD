<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Cliente</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0" th:text="${titulo}"></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${cliente.DPICliente != null} ? @{/clientes/actualizar/{dpi}(dpi=${cliente.DPICliente})} : @{/clientes/guardar}"
                              th:object="${cliente}" method="post">

                            <!-- Agrupación con fieldset -->
                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Información Personal</legend>
                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{nombreCliente}" class="form-control"
                                               th:classappend="${#fields.hasErrors('nombreCliente')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('nombreCliente')}" class="invalid-feedback" th:errors="*{nombreCliente}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Apellido <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{apellidoCliente}" class="form-control"
                                               th:classappend="${#fields.hasErrors('apellidoCliente')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('apellidoCliente')}" class="invalid-feedback" th:errors="*{apellidoCliente}"></div>
                                    </div>
                                    <div class="col-md-12">
                                        <label class="form-label fw-bold">Dirección <span class="text-danger">*</span></label>
                                        <textarea th:field="*{direccion}" class="form-control" rows="2"
                                                  th:classappend="${#fields.hasErrors('direccion')} ? 'is-invalid' : ''"></textarea>
                                        <div th:if="${#fields.hasErrors('direccion')}" class="invalid-feedback" th:errors="*{direccion}"></div>
                                    </div>
                                </div>
                            </fieldset>

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Datos de Identificación</legend>
                                <div class="row g-3">
                                    <div class="col-md-8">
                                        <label class="form-label fw-bold">DPI <span class="text-danger">*</span></label>
                                        <input type="text" th:field="*{DPICliente}" class="form-control"
                                               placeholder="13 dígitos sin espacios"
                                               th:readonly="${cliente.DPICliente != null}"
                                               th:classappend="${#fields.hasErrors('DPICliente')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('DPICliente')}" class="invalid-feedback" th:errors="*{DPICliente}"></div>
                                        <div class="form-text" th:unless="${cliente.DPICliente != null}">El DPI no se puede modificar después de crear el cliente.</div>
                                    </div>
                                    <div class="col-md-4">
                                        <label class="form-label fw-bold">Estado</label>
                                        <select th:field="*{estado}" class="form-select">
                                            <option th:value="1">Activo</option>
                                            <option th:value="0">Inactivo</option>
                                        </select>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/clientes}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
