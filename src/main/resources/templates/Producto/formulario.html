<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<div th:fragment="content">
    <div class="glass-card shadow-lg mx-auto" style="max-width: 800px;">
        <div class="p-4 border-bottom bg-light">
            <h5 class="mb-0 fw-bold text-primary">Detalles del Producto</h5>
        </div>
        <div class="card-body p-5">
            <form th:action="${producto.codigoProducto != null} ? @{/productos/actualizar/{code}(code=${producto.codigoProducto})} : @{/productos/guardar}"
                  th:object="${producto}" method="post">
                <div class="row g-4">
                    <div class="col-12">
                        <label class="form-label fw-bold small">Nombre del Producto</label>
                        <input type="text" th:field="*{nombreProducto}" class="form-control bg-light border-0 py-3" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Precio Unitario (Q)</label>
                        <input type="number" step="0.01" th:field="*{precio}" class="form-control bg-light border-0 py-3" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold small">Stock en Bodega</label>
                        <input type="number" th:field="*{stock}" class="form-control bg-light border-0 py-3" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label fw-bold small">Estado de Disponibilidad</label>
                        <select th:field="*{estado}" class="form-select bg-light border-0 py-3">
                            <option th:value="1">Activo - En Venta</option>
                            <option th:value="0">Inactivo - Sin Existencias</option>
                        </select>
                    </div>
                    <div class="col-12 pt-3">
                        <button type="submit" class="btn btn-primary btn-action px-5 shadow">Guardar Cambios</button>
                        <a th:href="@{/productos}" class="btn btn-light btn-action ms-2">Regresar</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
</html>
