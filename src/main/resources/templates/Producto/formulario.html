<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title th:text="${titulo}">Formulario Producto</title>
</head>
<body>
<div th:fragment="content">
    <div class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="mb-0" th:text="${titulo}"></h4>
                    </div>
                    <div class="card-body p-4">
                        <form th:action="${producto.codigoProducto != null} ? @{/productos/actualizar/{code}(code=${producto.codigoProducto})} : @{/productos/guardar}"
                              th:object="${producto}" method="post">

                            <fieldset class="border p-3 mb-3">
                                <legend class="w-auto px-2">Información del Producto</legend>
                                <div class="mb-3">
                                    <label class="form-label fw-bold">Nombre <span class="text-danger">*</span></label>
                                    <input type="text" th:field="*{nombreProducto}" class="form-control"
                                           th:classappend="${#fields.hasErrors('nombreProducto')} ? 'is-invalid' : ''">
                                    <div th:if="${#fields.hasErrors('nombreProducto')}" class="invalid-feedback" th:errors="*{nombreProducto}"></div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Precio <span class="text-danger">*</span></label>
                                        <div class="input-group">
                                            <span class="input-group-text">Q</span>
                                            <input type="number" step="0.01" th:field="*{precio}" class="form-control"
                                                   th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid' : ''">
                                        </div>
                                        <div th:if="${#fields.hasErrors('precio')}" class="invalid-feedback" th:errors="*{precio}"></div>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label fw-bold">Stock <span class="text-danger">*</span></label>
                                        <input type="number" step="1" min="0" th:field="*{stock}" class="form-control"
                                               th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid' : ''">
                                        <div th:if="${#fields.hasErrors('stock')}" class="invalid-feedback" th:errors="*{stock}"></div>
                                    </div>
                                </div>
                                <div class="mt-3">
                                    <label class="form-label fw-bold">Estado</label>
                                    <select th:field="*{estado}" class="form-select">
                                        <option th:value="1">Activo</option>
                                        <option th:value="0">Inactivo</option>
                                    </select>
                                </div>
                            </fieldset>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/productos}" class="btn btn-outline-secondary">Cancelar</a>
                                <button type="submit" class="btn btn-primary">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
