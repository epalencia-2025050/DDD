<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head><title th:text="${titulo}">Producto</title></head>
<body>
<div th:fragment="content">
    <div class="card">
        <div class="card-header"><h3 th:text="${titulo}"></h3></div>
        <div class="card-body">
            <form th:action="${producto.codigoProducto != null} ? @{/productos/actualizar/{code}(code=${producto.codigoProducto})} : @{/productos/guardar}"
                  th:object="${producto}" method="post">
                <div class="mb-3"><label>Nombre</label><input type="text" th:field="*{nombreProducto}" class="form-control" required></div>
                <div class="mb-3"><label>Precio</label><input type="number" step="0.01" th:field="*{precio}" class="form-control" required></div>
                <div class="mb-3"><label>Stock</label><input type="number" th:field="*{stock}" class="form-control" required></div>
                <div class="mb-3"><label>Estado</label>
                    <select th:field="*{estado}" class="form-select">
                        <option th:value="1">Activo</option>
                        <option th:value="0">Inactivo</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a th:href="@{/productos}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
</body>
</html>
