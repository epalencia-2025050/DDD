<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/base :: html}">
<head>
    <title>Lista de Productos</title>
</head>
<body>
<div th:fragment="content">
    <h1 class="mb-4" th:text="${titulo}">Productos</h1>
    <div class="mb-3">
        <a th:href="@{/productos/nuevo}" class="btn btn-primary">+ Nuevo Producto</a>
        <div class="btn-group">
            <a th:href="@{/productos/activos/1}" class="btn btn-outline-success">Activos</a>
            <a th:href="@{/productos/activos/0}" class="btn btn-outline-danger">Inactivos</a>
            <a th:href="@{/productos}" class="btn btn-outline-secondary">Todos</a>
        </div>
    </div>
    <table class="table table-striped table-hover">
        <thead>
        <tr>
            <th>Código</th>
            <th>Nombre</th>
            <th>Precio</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="p : ${productos}">
            <td th:text="${p.codigoProducto}"></td>
            <td th:text="${p.nombreProducto}"></td>
            <td th:text="${p.precio}"></td>
            <td th:text="${p.stock}"></td>
            <td>
                <span th:if="${p.estado == 1}" class="badge bg-success">Activo</span>
                <span th:if="${p.estado == 0}" class="badge bg-secondary">Inactivo</span>
            </td>
            <td>
                <a th:href="@{/productos/editar/{code}(code=${p.codigoProducto})}" class="btn btn-sm btn-warning">Editar</a>
                <a th:href="@{/productos/eliminar/{code}(code=${p.codigoProducto})}" class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(productos)}">
            <td colspan="6" class="text-center">No hay productos registrados</td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
