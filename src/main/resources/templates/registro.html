<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - KS SOLUTION'S</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --azul-marino: #1B365D;
            --azul-real: #2A5DA0;
            --naranja: #FF8C00;
            --exito: #28a745;
        }

        body {
            background: linear-gradient(135deg, var(--azul-marino) 0%, var(--azul-real) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', system-ui, sans-serif;
            margin: 0;
            padding: 20px 0;
        }

        .register-card {
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            background-color: rgba(255, 255, 255, 0.98);
        }

        .card-header {
            background-color: var(--exito) !important;
            border-bottom: 4px solid rgba(0,0,0,0.1);
            padding: 1.5rem;
        }

        .form-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .input-group-text {
            background-color: #f8f9fa;
            border-right: none;
            color: var(--exito);
        }

        .form-control {
            border-left: none;
            padding: 0.7rem 1rem;
        }

        .form-control:focus {
            border-color: #ced4da;
            box-shadow: none;
            background-color: #fff;
        }

        .btn-success {
            background-color: var(--exito);
            border: none;
            padding: 0.8rem;
            font-weight: 600;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-success:hover {
            background-color: #218838;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
        }

        .brand-link {
            color: var(--azul-marino);
            font-weight: 700;
            text-decoration: none;
        }

        .brand-link:hover {
            color: var(--naranja);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

            <div class="card register-card">
                <div class="card-header text-center text-white">
                    <i class="bi bi-person-plus-fill fs-1"></i>
                    <h3 class="mt-2 mb-0 fw-bold">Crear Cuenta</h3>
                    <p class="small opacity-75 mb-0">Únete a KS SOLUTION'S ERP</p>
                </div>

                <div class="card-body p-4 p-md-5">
                    <form th:action="@{/registro}" th:object="${usuario}" method="post">

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Nombre de usuario</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" th:field="*{username}" class="form-control"
                                       placeholder="Ej: jlopez2026" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold text-muted">Correo Electrónico</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" th:field="*{email}" class="form-control"
                                       placeholder="nombre@ejemplo.com" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold text-muted">Contraseña</label>
                            <div class="input-group shadow-sm">
                                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                                <input type="password" th:field="*{password}" class="form-control"
                                       placeholder="••••••••" required>
                            </div>
                            <div class="form-text small">Mínimo 8 caracteres recomendados.</div>
                        </div>

                        <button type="submit" class="btn btn-success w-100 mb-3 shadow">
                            <i class="bi bi-check2-circle me-2"></i>Registrar mi cuenta
                        </button>

                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">¿Ya eres parte del equipo?</p>
                            <a th:href="@{/login}" class="brand-link small">
                                <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar Sesión
                            </a>
                        </div>
                    </form>

                    <div th:if="${error}" class="alert alert-danger mt-4 border-0 shadow-sm small text-center" role="alert">
                        <i class="bi bi-exclamation-triangle-fill me-2"></i>
                        <span th:text="${error}"></span>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4 text-white-50 small">
                &copy; 2026 KS SOLUTION'S - Potenciando tu negocio
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
